[package]
name = "tantivy-remote"
description = "tantivy with opendal and sqlx"
version = "0.7.0"
homepage = "https://github.com/r3v2d0g/tantivy-remote"
documentation = "https://docs.rs/tantivy-remote"
license = "MPL-2.0"
authors = ["Matthieu (MLB) Le brazidec <r3v2d0g@jesus.gg>"]
edition = "2024"

# `gxhash` requires the `aes` and `sse2` target features, which docs.rs does not
# enable by default (it does not pass `-C target-cpu=native`). Without this, the
# docs.rs build fails with a `compile_error!` from gxhash.
[package.metadata.docs.rs]
rustc-args = ["-C", "target-feature=+aes,+sse2"]

[features]
# This makes `block-on-place` trace all calls to one of the crate's blocking
# functions from within a tokio runtime context.
blocking-tracing = ["block-on-place/tracing"]

[dependencies]
async-trait = "0.1"
block-on-place = "0.1"
derive_more = { version = "2.0", features = ["debug", "deref", "from"] }
eyre = "0.6"
gxhash = "3.5"
opendal = "0.54"
pin-project-lite = "0.2"
scc = "3.3"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid"] }
tantivy = { version = "0.26", features = ["quickwit"] }
tokio = { version = "1.48", features = ["macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = "1.18"

[dev-dependencies]
tokio = { version = "1.48", features = ["full"] }
